<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image2ThreeJS</title>
  <meta name="description" content="Drop an image, get an interactive 3D model in your browser." />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="app">
    <header>
      <h1>Image2ThreeJS</h1>
      <p>Drop an image. Get an interactive 3D model. Runs entirely in your browser.</p>
    </header>

    <section id="stage">
      <canvas id="view"></canvas>
      <canvas id="viewGpu" hidden></canvas>
      <div id="modes" role="group" aria-label="Renderer">
        <button id="mode-webgl" class="on">WebGL</button>
        <button id="mode-webgpu">WebGPU</button>
      </div>
      <label id="drop" for="file">
        <strong>Drop an image here</strong>
        <span>or click to choose · or paste from clipboard</span>
      </label>
      <input id="file" type="file" accept="image/*" hidden />
      <div id="status" hidden></div>
    </section>

    <section id="controls" hidden>
      <label>Depth <input id="depth" type="range" min="0" max="1.5" step="0.01" value="0.6" /></label>
      <label>Cut background <input id="cut" type="range" min="0" max="0.9" step="0.01" value="0" /></label>
      <label>Smooth <input id="smooth" type="range" min="0" max="4" step="1" value="1" /></label>
      <label class="check"><input id="wire" type="checkbox" /> Wireframe</label>
      <label class="check"><input id="spin" type="checkbox" checked /> Auto-rotate</label>
      <button id="export">Download .glb</button>
      <button id="reset" class="ghost">New image</button>
    </section>

    <footer>
      Depth estimated on-device with Depth Anything V2 · a relief reconstruction, so hidden sides are not modelled ·
      <a href="https://github.com/SumeetHedral/image2threejs">GitHub</a>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
